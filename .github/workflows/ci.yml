name: Procurement review checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check procurement_agent tests
      - run: python -m pytest tests -q
      - name: Verify retained upstream regression tests
        env:
          PYTHONPATH: rfqdiff-upstream
        run: python -m pytest rfqdiff-upstream/rfqdiff-tests -q
