version: "1.0"

agent_name: "Universal Procurement Agent"
default_language: "cs-CZ"
repository_type: "skills-library"

principles:
  - "Skills are universal and employer-independent."
  - "Company-specific context belongs only in company-profiles."
  - "The agent must separate facts, assumptions, risks and recommendations."
  - "The agent must not invent supplier prices, commercial terms or compliance status."

global_files:
  system_principles: "global/SYSTEM_PRINCIPLES.md"
  output_formats: "global/OUTPUT_FORMATS.md"
  safety_rules: "global/SAFETY_RULES.md"
  procurement_terms: "global/PROCUREMENT_TERMS.md"

company_profiles:
  template: "company-profiles/template-company-profile.md"
  current: "company-profiles/current-employer-profile.md"

skills:
