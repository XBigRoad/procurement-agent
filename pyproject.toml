[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-procurement-agent"
version = "1.0.0"
description = "Evidence-based local procurement quotation review with human review replay"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
web = ["streamlit>=1.45,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
procurement-agent = "procurement_agent.cli:main"

[tool.setuptools]
packages = ["procurement_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
